<svg width="100%" viewBox="0 0 820 408" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Kampung AI harness and governance architecture">
<title>Kampung AI — Harness &amp; Governance</title>
<desc>Input channels pass through the untrusted-input boundary into the MayaLoop spine (ingest, classify, plan, execute, observe, verify) with a bounded agentic loop-back. Three governance controls wrap the loop — event-store audit, permission kernel, steward review — before any gated tool runs.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text x="20" y="16" font-size="14" font-weight="700" fill="#0f172a">Kampung AI · Harness &amp; Governance</text>
<g font-size="10" fill="#6b7280">
<rect x="548" y="8" width="11" height="11" rx="2" fill="#f8fafc" stroke="#cbd5e1"/><text x="564" y="17">flow / component</text>
<rect x="676" y="8" width="11" height="11" rx="2" fill="#fff7ed" stroke="#b45309"/><text x="692" y="17">governance &amp; safety</text>
</g>

<text x="20" y="40" font-size="10" letter-spacing="1.5" fill="#94a3b8">CHANNELS · INPUT / READ SURFACES</text>
<g font-size="12" fill="#1f2937">
<rect x="20" y="46" width="148" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="94" y="66" text-anchor="middle">Telegram</text>
<rect x="178" y="46" width="148" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="252" y="66" text-anchor="middle">iMac voice</text>
<rect x="336" y="46" width="148" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="410" y="66" text-anchor="middle">Browser</text>
<rect x="494" y="46" width="148" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="568" y="66" text-anchor="middle">Screen</text>
<rect x="652" y="46" width="148" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="726" y="66" text-anchor="middle">Omi</text>
</g>
<path d="M410 78 L410 88" stroke="#94a3b8" fill="none" marker-end="url(#a)"/>

<rect x="20" y="88" width="780" height="40" rx="8" fill="#fff7ed" stroke="#b45309"/>
<text x="410" y="106" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b45309">GOVERNANCE · Untrusted-input boundary (W7, live)</text>
<text x="410" y="120" text-anchor="middle" font-size="10.5" fill="#6b7280">tags injected content from read surfaces · can only tighten the decision, never loosen</text>
<path d="M79 128 L79 150" stroke="#94a3b8" fill="none" marker-end="url(#a)"/>

<text x="120" y="146" font-size="10" letter-spacing="1.5" fill="#94a3b8">HARNESS · MayaLoop spine</text>
<path d="M739 150 L739 138 L343 138 L343 150" stroke="#b45309" stroke-dasharray="5 4" fill="none" marker-end="url(#ag)"/>
<text x="541" y="134" text-anchor="middle" font-size="10.5" fill="#b45309">agentic loop ≤8 steps · fail-closed verifier (finishes only on explicit YES)</text>

<g font-size="12" fill="#1f2937">
<rect x="20" y="150" width="118" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="79" y="183" text-anchor="middle">Ingest</text>
<rect x="152" y="150" width="118" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="211" y="183" text-anchor="middle">Classify</text>
<rect x="284" y="150" width="118" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="343" y="183" text-anchor="middle">Plan</text>
<rect x="416" y="150" width="118" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="475" y="183" text-anchor="middle">Execute</text>
<rect x="548" y="150" width="118" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="607" y="183" text-anchor="middle">Observe</text>
<rect x="680" y="150" width="118" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="739" y="183" text-anchor="middle">Verify</text>
</g>
<g stroke="#94a3b8" fill="none">
<path d="M138 178 L152 178" marker-end="url(#a)"/>
<path d="M270 178 L284 178" marker-end="url(#a)"/>
<path d="M402 178 L416 178" marker-end="url(#a)"/>
<path d="M534 178 L548 178" marker-end="url(#a)"/>
<path d="M666 178 L680 178" marker-end="url(#a)"/>
</g>

<path d="M170 206 L170 234" stroke="#94a3b8" stroke-opacity="0.7" fill="none" marker-end="url(#a)"/>
<path d="M475 206 L463 234" stroke="#b45309" fill="none" marker-end="url(#ag)"/>

<rect x="20" y="234" width="300" height="54" rx="8" fill="#fff7ed" stroke="#b45309"/>
<text x="170" y="256" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b45309">Event Store · append-only audit</text>
<text x="170" y="272" text-anchor="middle" font-size="10.5" fill="#6b7280">every node + route + cost recorded</text>

<rect x="336" y="234" width="240" height="54" rx="8" fill="#fff7ed" stroke="#b45309"/>
<text x="456" y="256" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b45309">Permission Kernel</text>
<text x="456" y="272" text-anchor="middle" font-size="10.5" fill="#6b7280">allow · confirm · deny · hard-block</text>

<rect x="592" y="234" width="208" height="54" rx="8" fill="#fff7ed" stroke="#b45309"/>
<text x="696" y="256" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b45309">Steward review</text>
<text x="696" y="272" text-anchor="middle" font-size="10.5" fill="#6b7280">artifact + memory QA</text>

<path d="M456 288 L456 312" stroke="#b45309" fill="none" marker-end="url(#ag)"/>
<text x="20" y="308" font-size="10" letter-spacing="1.5" fill="#94a3b8">TOOLS · GATED SIDE EFFECTS</text>
<g font-size="11.5" fill="#1f2937">
<rect x="20" y="312" width="118" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="79" y="332" text-anchor="middle">Browser</text>
<rect x="152" y="312" width="118" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="211" y="332" text-anchor="middle">Office docs</text>
<rect x="284" y="312" width="118" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="343" y="332" text-anchor="middle">Files</text>
<rect x="416" y="312" width="118" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="475" y="332" text-anchor="middle">MCP</text>
<rect x="548" y="312" width="118" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="607" y="332" text-anchor="middle">Codex</text>
<rect x="680" y="312" width="118" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="739" y="332" text-anchor="middle">memory.write</text>
</g>

<text x="20" y="368" font-size="10.5" fill="#6b7280">Secrets / API keys are hard-blocked at the kernel and never reach tools or memory. The agentic loop is opt-in and bounded (≤8 steps).</text>
<text x="20" y="386" font-size="10.5" fill="#6b7280">The same governance shell (amber) wraps the action path here and the memory path in the companion diagram.</text>
</svg>
