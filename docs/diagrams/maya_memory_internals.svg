<text x="210" y="290" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Direct-fact recall</text>
<text x="210" y="306" text-anchor="middle" font-size="10.5" fill="#6b7280">refuses if the only match is forgotten · never guesses</text>

<rect x="414" y="268" width="380" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="604" y="290" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Relevance + neighbor boost</text>
<text x="604" y="306" text-anchor="middle" font-size="10.5" fill="#6b7280">lexical score · 1-hop links (live) · gated embedding rerank</text>

<path d="M210 320 L210 340 L407 340" stroke="#b45309" stroke-dasharray="5 4" fill="none"/>
<path d="M604 320 L604 340 L407 340" stroke="#b45309" stroke-dasharray="5 4" fill="none"/>
<rect x="300" y="332" width="214" height="28" rx="14" fill="#fff7ed" stroke="#b45309"/>
<text x="407" y="350" text-anchor="middle" font-size="10.5" fill="#b45309">→ prompt context into MayaLoop · Plan</text>

<rect x="20" y="374" width="774" height="46" rx="8" fill="#fff7ed" stroke="#b45309"/>
<text x="407" y="393" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">GOVERNANCE</text>
<text x="407" y="408" text-anchor="middle" font-size="10.5" fill="#6b7280">audit log (sha256, redacted previews) · 5 canaries leak-scan 7 derived tables · forget = no-resurrect · reviewer-gated writes</text>

<text x="20" y="446" font-size="10" letter-spacing="1.5" fill="#94a3b8">NIGHTLY CONSOLIDATION · sleep cycle (two provider calls, zero-delta skip)</text>
<g font-size="10" fill="#1f2937">
<rect x="20" y="452" width="120" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="80" y="473" text-anchor="middle">replay day</text>
<rect x="168" y="452" width="150" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="243" y="473" text-anchor="middle">distill facts + links</text>
<rect x="346" y="452" width="120" height="34" rx="6" fill="#fff7ed" stroke="#b45309"/><text x="406" y="473" text-anchor="middle" fill="#b45309">reviewer gate</text>
<rect x="494" y="452" width="150" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="569" y="473" text-anchor="middle">supersede / dedup</text>
<rect x="672" y="452" width="122" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="733" y="473" text-anchor="middle">decay report</text>
</g>
<g stroke="#94a3b8" fill="none">
<path d="M140 469 L168 469" marker-end="url(#a)"/>
