</g>

<text x="20" y="508" font-size="10.5" fill="#6b7280">Truth layer is the only source of truth; preferences, lessons, curated memory, and summaries are derived views — never truth.</text>
<text x="20" y="525" font-size="10.5" fill="#6b7280">Decay is report-only (no auto-delete). Acting on a decay candidate stays a human decision.</text>
</svg>
