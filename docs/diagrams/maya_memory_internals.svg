<rect x="216" y="46" width="186" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="309" y="69" text-anchor="middle">extraction (provider+regex)</text>
<rect x="412" y="46" width="186" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="505" y="69" text-anchor="middle">Omi context sieve</text>
<rect x="608" y="46" width="186" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="701" y="69" text-anchor="middle">nightly consolidation</text>
</g>
<g stroke="#94a3b8" fill="none">
<path d="M113 84 L113 102" marker-end="url(#a)"/>
<path d="M309 84 L309 102" marker-end="url(#a)"/>
<path d="M505 84 L505 102" marker-end="url(#a)"/>
<path d="M701 84 L701 102" marker-end="url(#a)"/>
</g>

<rect x="20" y="102" width="774" height="40" rx="8" fill="#fff7ed" stroke="#b45309"/>
<text x="407" y="120" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b45309">upsert_canonical_memory()</text>
<text x="407" y="134" text-anchor="middle" font-size="10.5" fill="#6b7280">sensitive block · dedup / supersede · forgotten facts cannot be resurrected by derived writers</text>
<path d="M407 142 L407 160" stroke="#b45309" fill="none" marker-end="url(#ag)"/>

<rect x="20" y="160" width="774" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="36" y="182" font-size="12.5" font-weight="600" fill="#1f2937">Canonical truth layer — single source of truth (canonical_memory_items)</text>
<g font-size="10.5" fill="#334155">
<rect x="36" y="196" width="80" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/><text x="76" y="213" text-anchor="middle">active</text>
<rect x="124" y="196" width="92" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/><text x="170" y="213" text-anchor="middle">forgotten</text>
<rect x="224" y="196" width="82" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/><text x="265" y="213" text-anchor="middle">expired</text>
