<svg width="100%" viewBox="0 0 820 540" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Kampung AI memory subsystem internals">
<title>Kampung AI — Memory Internals (governed truth layer)</title>
<desc>Four write paths feed a guarded upsert into the canonical truth layer. Two read paths serve recall and feed context back to the harness. An append-only audit log, five canaries, and a forget-no-resurrect guarantee govern the whole store. A nightly consolidation lane distills the day into facts and links under a reviewer gate.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text x="20" y="16" font-size="14" font-weight="700" fill="#0f172a">Kampung AI · Memory Internals — governed truth layer</text>
<g font-size="10" fill="#6b7280">
<rect x="548" y="8" width="11" height="11" rx="2" fill="#f8fafc" stroke="#cbd5e1"/><text x="564" y="17">flow / component</text>
<rect x="676" y="8" width="11" height="11" rx="2" fill="#fff7ed" stroke="#b45309"/><text x="692" y="17">governance &amp; safety</text>
</g>

